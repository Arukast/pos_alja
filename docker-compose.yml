x-app-environment: &app-environment
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-pos_alja}
    DB_USERNAME: ${DB_USERNAME:-pos_alja}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    DB_QUEUE_RETRY_AFTER: "900"
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: app
        env_file: .env
        environment: *app-environment
        volumes:
            - backupdata:/var/www/html/storage/app/backups
        depends_on:
            db:
                condition: service_healthy
            reverb:
                condition: service_started
        restart: unless-stopped

    nginx:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: web
            args:
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8084}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        ports:
            - "80:80"
        depends_on:
            app:
                condition: service_started
        restart: unless-stopped

    reverb:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: app
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: "5432"
            DB_DATABASE: ${DB_DATABASE:-pos_alja}
            DB_USERNAME: ${DB_USERNAME:-pos_alja}
            DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            BROADCAST_CONNECTION: reverb
            REVERB_HOST: 0.0.0.0
            REVERB_PORT: "8080"
            REVERB_SCHEME: http
        ports:
            - "8084:8080"
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: app
        command: php artisan queue:work --sleep=3 --tries=1 --timeout=600
        env_file: .env
        environment: *app-environment
        volumes:
            - backupdata:/var/www/html/storage/app/backups
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: app
        command: php artisan schedule:work
        env_file: .env
        environment: *app-environment
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-pos_alja}
            POSTGRES_USER: ${DB_USERNAME:-pos_alja}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pos_alja} -d ${DB_DATABASE:-pos_alja}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    pgdata:
    backupdata:
