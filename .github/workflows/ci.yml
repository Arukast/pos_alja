name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    # Grant permissions required for git-auto-commit-action to write back to the branch
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        # Fetch all history so git checkout works properly for auto-commits
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Install NPM Dependencies
      run: npm ci

    - name: Run Code Style Fixes (Pint)
      run: ./vendor/bin/pint

    - name: Commit Auto-Formatted Style Changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "style: auto-fix code formatting with Pint"

    - name: Security Check (Composer Audit)
      run: composer audit

    - name: Run Static Analysis (Larastan)
      run: ./vendor/bin/phpstan analyse --memory-limit=1G

    - name: Build Assets
      run: npm run build

    - name: Run Tests
      run: php artisan test
